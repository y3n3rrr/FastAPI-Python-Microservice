[project]
name = "fastapi-project"
version = "0.1.0"
description = "Sustainable FastAPI service layout"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic-settings",
    "email-validator",
    "uvicorn",
    "langgraph",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
